title: Kerberoasting — Suspicious Kerberos TGS Request for Service Account
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: test
description: >
  Detects Kerberoasting activity — an attacker requesting Kerberos service
  tickets (TGS) for accounts with SPNs in order to crack them offline.
  Key indicator is Event ID 4769 with encryption type 0x17 (RC4-HMAC),
  which is weak and preferred by attackers over stronger AES encryption.
references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.credential_access
  - attack.t1558
  - attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketOptions: '0x40810000'
    TicketEncryptionType: '0x17'
  filter_legitimate:
    ServiceName|endswith: '$'
  condition: selection and not filter_legitimate
falsepositives:
  - Legacy systems that only support RC4 encryption
  - Some older applications using Kerberos with RC4
level: high
fields:
  - ServiceName
  - ClientAddress
  - TicketEncryptionType
  - TicketOptions