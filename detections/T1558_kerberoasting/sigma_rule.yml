title: Kerberos Pre-Authentication Failure — Possible Password Spray or Brute Force
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: test
description: >
  Detects Kerberos pre-authentication failures (Event ID 4771) with status
  code 0x18 (wrong password). Multiple failures against the same account or
  across accounts indicates password spraying or brute force attempts against
  Active Directory. Complements Kerberoasting detection (T1558.003).
references:
  - https://attack.mitre.org/techniques/T1558/
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.credential_access
  - attack.t1558
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4771
    Status: '0x18'
  condition: selection
falsepositives:
  - Legitimate users mistyping passwords repeatedly
  - Password expiry causing service account failures
level: medium
fields:
  - TargetUserName
  - IpAddress
  - Status
  - TicketOptions
  - ServiceName
