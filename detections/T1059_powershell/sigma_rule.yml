title: Suspicious PowerShell — Encoded Command Execution
id: e5f6a7b8-c9d0-1234-efab-345678901234
status: test
description: >
  Detects PowerShell launched with encoded command flags (-EncodedCommand, -enc, -ec),
  commonly used by attackers to obfuscate malicious script payloads and bypass
  script-block logging. Legitimate use is rare outside of deployment tooling.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - ' -EncodedCommand '
      - ' -enc '
      - ' -ec '
      - ' -e '
  filter_sccm:
    ParentImage|contains:
      - '\ccmexec.exe'
      - '\sccm'
  condition: selection and not filter_sccm
falsepositives:
  - SCCM/ConfigMgr software deployment using encoded PS commands
  - Some legitimate administrative scripts using encoded payloads
level: medium
fields:
  - CommandLine
  - ParentImage
  - User
  - Image