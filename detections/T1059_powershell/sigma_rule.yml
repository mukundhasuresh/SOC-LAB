title: Malicious PowerShell Script Block — Obfuscated Code Execution (EID 4104)
id: e5f6a7b8-c9d0-1234-efab-345678901234
status: test
description: >
  Detects PowerShell script block logging Event ID 4104 containing obfuscation
  patterns — string concatenation to reconstruct commands, mixed case evasion,
  and suspicious cmdlets (New-Item in TEMP, Net. namespace usage). EID 4104
  captures the deobfuscated script before execution, making it high-fidelity.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.001
logsource:
  product: windows
  service: powershell
detection:
  selection_scriptblock:
    EventID: 4104
  selection_obfuscation:
    ScriptBlockText|contains:
      - "'+'"
      - 'eNV:teMP'
      - 'itemtype DIrectOry'
      - '[Net.'
  condition: selection_scriptblock and selection_obfuscation
falsepositives:
  - Rare legitimate scripts using string concatenation
  - Obfuscated deployment scripts from some vendors
level: high
fields:
  - ScriptBlockText
  - ScriptBlockId
  - Path
