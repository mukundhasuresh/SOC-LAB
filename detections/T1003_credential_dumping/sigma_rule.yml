title: Suspicious LSASS Process Access — Credential Dumping
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: test
description: >
  Detects suspicious access to the LSASS process, a common technique used
  by credential dumping tools such as Mimikatz. Attackers open a handle to
  LSASS with specific access rights to extract password hashes from memory.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.credential_access
  - attack.t1003
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x147a'
      - '0x143a'
      - '0x1438'
      - '0x1fffff'
  filter_legitimate:
    SourceImage|contains:
      - '\Windows\System32\svchost.exe'
      - '\Windows\System32\wininit.exe'
      - '\Windows\System32\lsass.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate security tools and EDR agents that access LSASS
  - AV software performing memory scans
level: high
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
  - CallTrace