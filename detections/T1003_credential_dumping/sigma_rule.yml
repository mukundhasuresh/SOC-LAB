title: Suspicious Process Memory Access via Sysmon (Credential Access Pattern)
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: test
description: >
  Detects suspicious process memory access captured by Sysmon Event ID 10.
  Covers credential dumping techniques including tools that access process
  memory with high GrantedAccess values. The dataset example captures a
  TeamViewer memory access with GrantedAccess 0x147a — a value associated
  with credential theft tooling.
references:
  - https://attack.mitre.org/techniques/T1003/
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.credential_access
  - attack.t1003
logsource:
  product: windows
  category: process_access
detection:
  selection:
    EventID: 10
    GrantedAccess|contains:
      - '0x147a'
      - '0x1010'
      - '0x1410'
      - '0x143a'
      - '0x1438'
      - '0x1fffff'
  condition: selection
falsepositives:
  - Legitimate security tools, EDR agents, AV performing memory inspection
level: high
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
  - CallTrace