title: Process Injection — Remote Thread Creation into Foreign Process
id: d4e5f6a7-b8c9-0123-defa-234567890123
status: test
description: >
  Detects process injection via remote thread creation (Sysmon Event ID 8 —
  CreateRemoteThread). Attackers inject malicious code into legitimate processes
  to evade detection and inherit the target process's privileges and trust.
references:
  - https://attack.mitre.org/techniques/T1055/
  - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    EventID: 8
  filter_legitimate:
    SourceImage|contains:
      - '\Windows\System32\csrss.exe'
      - '\Windows\System32\wininit.exe'
      - '\Windows\System32\svchost.exe'
      - '\Windows\System32\lsass.exe'
    TargetImage|contains:
      - '\Windows\System32\csrss.exe'
      - '\Windows\System32\wininit.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate software using remote threads (some AV/EDR, JIT compilers)
  - .NET CLR activity
level: high
fields:
  - SourceImage
  - TargetImage
  - StartAddress
  - StartFunction
  - StartModule