title: Process Injection — Remote Thread Created in Remote Process (Sysmon EID 8)
id: d4e5f6a7-b8c9-0123-defa-234567890123
status: test
description: >
  Detects remote thread creation into another process via Sysmon Event ID 8
  (CreateRemoteThread). The dataset captures a tool (m.exe from a network share)
  injecting a thread into explorer.exe — a classic process injection pattern
  used to hide malicious code inside a trusted host process.
references:
  - https://attack.mitre.org/techniques/T1055/
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection:
    EventID: 8
  filter_legitimate:
    SourceImage|contains:
      - 'C:\Windows\System32\csrss.exe'
      - 'C:\Windows\System32\wininit.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate software using CreateRemoteThread (some AV/EDR, JIT compilers)
level: high
fields:
  - SourceImage
  - TargetImage
  - NewThreadId
  - StartAddress
  - StartModule
  - StartFunction
