title: Pass-the-Hash — NTLM Lateral Movement with Explicit Credentials
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: test
description: >
  Detects Pass-the-Hash lateral movement. Attackers use a stolen NTLM hash
  to authenticate without knowing the plaintext password. Key indicator is
  Event ID 4624 (successful logon) with LogonType 3 (network) or 9 (NewCredentials),
  using NTLM authentication and a suspicious source process.
references:
  - https://attack.mitre.org/techniques/T1550/002/
  - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.lateral_movement
  - attack.defense_evasion
  - attack.t1550
  - attack.t1550.002
logsource:
  product: windows
  service: security
detection:
  selection_logon:
    EventID: 4624
    LogonType:
      - 3
      - 9
    AuthenticationPackageName: 'NTLM'
  filter_local:
    SubjectUserName|endswith: '$'
  condition: selection_logon and not filter_local
falsepositives:
  - Legitimate NTLM authentication in environments that haven't fully moved to Kerberos
  - Helpdesk tools using explicit NTLM credentials
level: high
fields:
  - SubjectUserName
  - TargetUserName
  - LogonType
  - IpAddress
  - WorkstationName
  - AuthenticationPackageName