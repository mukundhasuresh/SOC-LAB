title: Pass-the-Hash — Special Privileges Assigned to New Logon (NTLM Network Logon)
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: test
description: >
  Detects Pass-the-Hash by correlating Event ID 4624 (successful logon with
  LogonType 3 network logon) followed by Event ID 4672 (special privileges
  assigned). This combination where NTLM is used for a network logon that
  immediately receives elevated privileges is a strong PtH indicator.
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.lateral_movement
  - attack.defense_evasion
  - attack.t1550
  - attack.t1550.002
logsource:
  product: windows
  service: security
detection:
  selection_logon:
    EventID: 4624
    LogonType: 3
  selection_privileges:
    EventID: 4672
  condition: selection_logon or selection_privileges
falsepositives:
  - Legitimate network logons with admin privileges
  - Service accounts with elevated rights doing scheduled tasks
level: high
fields:
  - SubjectUserName
  - TargetUserName
  - LogonType
  - IpAddress
  - AuthenticationPackageName
