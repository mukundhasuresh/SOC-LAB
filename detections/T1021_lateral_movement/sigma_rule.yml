title: Lateral Movement — PsExec Remote Service Creation via SMB
id: f6a7b8c9-d0e1-2345-fabc-456789012345
status: test
description: >
  Detects lateral movement using PsExec or similar tools that create a remote
  service over SMB. Sysmon Event ID 1 captures the PSEXESVC.exe process created
  on the target system; Event ID 13 captures the service registry key creation.
  This is one of the most common lateral movement techniques in real incidents.
references:
  - https://attack.mitre.org/techniques/T1021/002/
  - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.lateral_movement
  - attack.t1021
  - attack.t1021.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_psexec:
    EventID: 1
    Image|endswith: '\PSEXESVC.exe'
  selection_service:
    EventID: 13
    TargetObject|contains: '\System\CurrentControlSet\Services\PSEXESVC'
  condition: selection_psexec or selection_service
falsepositives:
  - Legitimate use of PsExec by IT administrators for remote management
  - Authorised remote support tools
level: high
fields:
  - Image
  - ParentImage
  - CommandLine
  - User
  - TargetObject