title: Lateral Movement — PsExec Named Pipe Creation (Sysmon EID 18)
id: f6a7b8c9-d0e1-2345-fabc-456789012345
status: test
description: >
  Detects PsExec lateral movement via Sysmon Event ID 18 (PipeEvent — Pipe
  Connected). PsExec uses the named pipe \ntsvcs or \psexesvc for communication
  between the attacker and the remote service it installs. The pipe name is a
  reliable, low-noise indicator of PsExec activity.
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: SOC Detection Lab
date: 2025/01/01
tags:
  - attack.lateral_movement
  - attack.t1021
  - attack.t1021.002
logsource:
  product: windows
  category: pipe_created
detection:
  selection:
    EventID:
      - 17
      - 18
    PipeName|contains:
      - '\ntsvcs'
      - '\psexesvc'
      - '\PSEXESVC'
  condition: selection
falsepositives:
  - Legitimate administrative use of PsExec by IT teams
level: high
fields:
  - PipeName
  - Image
  - ProcessId